        type: string
      style: simple
    post:
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: final migration state with per-statement results
        "404":
          description: not found
      summary: "apply (or retry) a pending/failed/partial migration: drift preflight\
        \ on a fresh introspection, then run — one transaction on postgres/sqlite\
        \ (all-or-nothing), sequential autocommit on mysql (`partial` + resume). Applied\
        \ migrations reject re-apply."
