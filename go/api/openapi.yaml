          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_designer_designs__id__publish_post_request"
      responses:
        "200":
          description: migration + nullable version (with per-statement results)
        "400":
          description: "destructive diff without confirm, or validation error"
        "409":
          description: no-op publish (empty diff)
      summary: "two-step publish (V9.1): derive the N-1→N migration from the model\
        \ diff and apply it immediately when the design has a `target_alias` (else\
        \ the migration stays `pending`). The version snapshot commits only on migration\
        \ success — a failed apply never consumes a version number (`version` comes\
        \ back null and the failed migration row keeps its per-statement results for\
        \ retry). Empty diff → 409; destructive ops require `confirm_destructive`."
