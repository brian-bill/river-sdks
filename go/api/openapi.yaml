openapi: 3.1.0
info:
  description: |
    Cross-database SQL federation engine: River federation, Warden instance orchestration, query files, notebooks, the filestore (bucket volumes mounted at /home/river/rfs inside notebook runtimes) and the Lily AI. Source of truth for route shapes is `src/api.rs` — this spec tracks it, schemas are indicative. Auth: a `Bearer <jwt>` from /auth/register|login|refresh, an `x-api-key` `rqk_…` key issued post-login, or an operator-configured static key (bootstrap org). Public (no auth): `/v1/health`, `/`, `/v1/ai/status`, `/v1/auth/login|register|refresh`. Everything else is 401 fail-closed and RBAC-gated (`module:resource:action` permissions per org role).
  title: River REST API
  version: 0.9.0
servers:
- url: https://api.warden.ke/v1
security:
- bearerAuth: []
- ApiKeyAuth: []
paths:
  /health:
    get:
      responses:
        "200":
          description: service health
      security: []
  /connections:
    get:
      responses:
        "200":
          description: list with health status
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_connections_post_request"
        required: true
      responses:
        "201":
          description: created + test_result
        "400":
          description: validation error
  /connections/{alias}:
    delete:
      parameters:
      - explode: false
        in: path
        name: alias
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: removed
  /connections/{alias}/test:
    post:
      parameters:
      - explode: false
        in: path
        name: alias
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: health result
        "502":
          description: unreachable
  /connections/{alias}/introspect:
    post:
      parameters:
      - explode: false
        in: path
        name: alias
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: refreshed schema
  /schema/{alias}:
    get:
      parameters:
      - explode: false
        in: path
        name: alias
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: cached schema (auto-introspects if stale)
  /query:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_query_post_request"
      responses:
        "200":
          description: results
  /query/explain:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_query_explain_post_request"
      responses:
        "200":
          description: logical plan + native sub-queries (+ AI walkthrough)
  /query/history:
    get:
      responses:
        "200":
          description: recent structured query records
  /tables/{alias}/rows/query:
    post:
      parameters:
      - explode: false
        in: path
        name: alias
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_tables__alias__rows_query_post_request"
        required: true
      responses:
        "200":
          description: TableRows
        "400":
          description: unknown column/op or unsupported value
      summary: read one page of a table (validated filters/sort/projection; no raw
        SQL crosses the wire)
  /tables/{alias}/rows:
    patch:
      parameters:
      - explode: false
        in: path
        name: alias
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_tables__alias__rows_patch_request"
        required: true
      responses:
        "200":
          description: TableRowMutation (updated counter)
      summary: update rows keyed by primary key (zero rows matched → row_conflict
        per item)
    post:
      parameters:
      - explode: false
        in: path
        name: alias
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_tables__alias__rows_post_request"
        required: true
      responses:
        "200":
          description: TableRowMutation (inserted counter)
      summary: insert rows (per-row authoritative outcome; auto columns are omitted)
  /tables/{alias}/rows/delete:
    post:
      parameters:
      - explode: false
        in: path
        name: alias
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_tables__alias__rows_delete_post_request"
        required: true
      responses:
        "200":
          description: TableRowMutation (deleted counter)
      summary: delete rows keyed by primary key (zero rows matched → row_conflict
        per item)
  /tables/{alias}/truncate:
    post:
      parameters:
      - explode: false
        in: path
        name: alias
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_tables__alias__truncate_post_request"
        required: true
      responses:
        "200":
          description: truncated + native statement
        "400":
          description: confirm mismatch
        "403":
          description: query:schema:write required (or read-only connection)
      summary: delete every row of a table — requires confirm to exactly equal the
        table name
  /tables/{alias}/drop:
    post:
      parameters:
      - explode: false
        in: path
        name: alias
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_tables__alias__drop_post_request"
        required: true
      responses:
        "200":
          description: dropped + native statement; schema cache invalidated
        "400":
          description: confirm mismatch or unsupported cascade
        "403":
          description: query:schema:write required (or read-only connection)
      summary: drop a table — requires confirm to exactly equal the table name
  /query/stream:
    post:
      description: "NDJSON stream: {\"columns\":[...]} then {\"row\":[...]}* then\
        \ {\"done\":{row_count,duration_ms,strategy,query_id}} — or a terminal {\"\
        error\":{code,message}} frame. SQL pushdown plans stream row-by-row; other\
        \ plans buffer then flush in batches."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_query_stream_post_request"
        required: true
      responses:
        "200":
          content:
            application/x-ndjson:
              schema:
                type: string
          description: application/x-ndjson frame sequence
        "400":
          description: unsupported statement for streaming
  /files:
    get:
      description: list query files as a tree (content omitted)
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_files_get_200_response"
          description: tree of query-file nodes
    post:
      description: create a query file (or folder — any node may parent others)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_files_post_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_files_post_201_response"
          description: created node
        "400":
          description: invalid name or unknown parent
  /files/{id}:
    delete:
      description: delete node and all descendants; returns deleted count
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_files__id__delete_200_response"
          description: removed
        "404":
          description: no such file
    get:
      description: read one query file including content
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_files_post_201_response"
          description: the file
        "404":
          description: no such file
    put:
      description: save name and/or content (at least one required)
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_files__id__put_request"
        required: true
      responses:
        "200":
          description: updated file
        "400":
          description: nothing to save / content over 1 MiB cap
        "404":
          description: no such file
  /bi/dashboards:
    get:
      description: "list the org's BI dashboards (metadata only, tiles omitted)"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_bi_dashboards_get_200_response"
          description: dashboards of the caller's org
    post:
      description: "create a dashboard; tiles is a validated JSON array (≤100 objects\
        \ each with a string `type`, ≤1 MiB)"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_bi_dashboards_post_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_bi_dashboards_post_201_response"
          description: created dashboard
        "400":
          description: invalid name or tiles contract
  /bi/dashboards/{id}:
    delete:
      description: delete the dashboard (org-scoped)
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_bi_dashboards__id__delete_200_response"
          description: removed
        "404":
          description: no such dashboard
    get:
      description: read one dashboard including its tiles
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_bi_dashboards_post_201_response"
          description: the dashboard
        "404":
          description: no such dashboard
    put:
      description: save name and/or tiles and/or filters (at least one required);
        org-scoped
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_bi_dashboards__id__put_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_bi_dashboards_post_201_response"
          description: updated dashboard
        "400":
          description: nothing to save / tiles contract violated
        "404":
          description: no such dashboard
  /bi/dashboards/{id}/data:
    post:
      description: |
        M3: refresh ALL tiles of one dashboard in a single request — each tile's SQL (with `:params` bound from the filter values) runs through the standard pipeline in parallel, served through the per-tile TTL cache (`refresh_ttl_secs`). Tile SQL executes with the CALLER's principal, so data-plane connection ACLs keep applying. Gated on bi:dashboards:view (viewers ride the cached, tile-vetted surface instead of raw query:execute:run).
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_bi_dashboards__id__data_post_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BiDashboardData"
          description: per-tile results (cached or freshly executed); `drill` present
            when requested
        "403":
          description: missing bi:dashboards:view
        "404":
          description: no such dashboard
  /bi/dashboards/{id}/embed:
    delete:
      description: revoke the embed token (embeds stop resolving immediately)
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_bi_dashboards__id__embed_delete_200_response"
          description: revoked
        "403":
          description: missing bi:dashboards:manage
    post:
      description: |
        M4: create (or ROTATE) the dashboard's public embed token (rbi_ + 32 hex chars of CSPRNG). The token is the only credential on the public /v1/bi/embed/{token} routes; rotation invalidates every previously distributed URL. Gated on bi:dashboards:manage.
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_bi_dashboards__id__embed_post_200_response"
          description: minted token + the embed page path
        "403":
          description: missing bi:dashboards:manage
        "404":
          description: no such dashboard
  /bi/embed/{token}:
    get:
      description: |
        M4 PUBLIC (no session; the URL token is the credential): the embed page's document — name, tiles and filters of one dashboard. Token mismatch revokes to the same 404.
      parameters:
      - explode: false
        in: path
        name: token
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_bi_embed__token__get_200_response"
          description: the embeddable dashboard document
        "404":
          description: unknown or revoked token
        "429":
          description: per-token rate limit exceeded
  /bi/embed/{token}/data:
    post:
      description: |
        M4 PUBLIC: tile data for the embed page. Snapshot-first (a stored snapshot answers without touching the data plane); live fallback executes tile SQL under the dashboard's ORG principal (there is no caller identity), TTL-cached like the authenticated /data route and rate-limited per token.
      parameters:
      - explode: false
        in: path
        name: token
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_bi_embed__token__data_post_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BiDashboardData"
          description: per-tile results; source is "snapshot" or "live"
        "404":
          description: unknown or revoked token
        "429":
          description: per-token rate limit exceeded
  /bi/dashboards/{id}/snapshot:
    delete:
      description: M4 — drop the stored snapshot
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_bi_dashboards__id__delete_200_response"
          description: removed
    get:
      description: "M4 — the latest stored snapshot (tiles + metadata), or null"
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_bi_dashboards__id__snapshot_get_200_response"
          description: latest snapshot or null when none captured yet
    post:
      description: |
        M4: capture a fresh snapshot of every tile (parallel, cache-bypassing) under the CALLER's principal and store it as the dashboard's single latest snapshot (bi.snapshots, latest-wins). Slow sources: heavy tiles run on the manager's schedule; viewers and embeds replay the stored results. Gated on bi:dashboards:manage.
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_bi_dashboards__id__snapshot_post_200_response"
          description: snapshot captured
        "403":
          description: missing bi:dashboards:manage
  /bi/tile/preview:
    post:
      description: |
        run ONE tile's SQL through the standard pipeline and return the result set for the dashboard renderer. Read-only by construction — only SELECT queries are accepted. Gated on query:execute:run (the same permission as POST /v1/query). M3: `:params` bind from `values` (macro substitution with typed literals — numeric stays unquoted, everything else is quote-escaped).
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_bi_tile_preview_post_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResult"
          description: executed result set (columns + rows) for the renderer
        "400":
          description: not a SELECT / failed to parse
        "403":
          description: missing query:execute:run
  /ai/nl-to-sql:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_ai_nl_to_sql_post_request"
      responses:
        "200":
          description: generated SQL + validity
        "503":
          description: opencode unavailable
  /ai/conversations:
    post:
      description: |
        Create a Lily conversation thread (full transcript stored server-side, org-scoped). Title falls back to "New chat".
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_ai_conversations_post_request"
      responses:
        "200":
          description: created conversation (full transcript)
        "400":
          description: caps violated (messages count / bytes / title)
  /ai/conversations/{id}:
    delete:
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: removed
        "404":
          description: no such conversation (org-scoped)
    get:
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: one conversation with its full transcript
        "404":
          description: no such conversation (org-scoped)
    parameters:
    - explode: false
      in: path
      name: id
      required: true
      schema:
        type: string
      style: simple
    put:
      description: Save title and/or messages (at least one required).
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_ai_conversations__id__put_request"
      responses:
        "200":
          description: saved conversation
        "404":
          description: no such conversation (org-scoped)
  /ai/lily:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_ai_lily_post_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_ai_lily_post_200_response"
          description: Lily reply + extracted SQL + whitelisted confirm-cards
  /ai/bi/tile:
    post:
      description: |
        Lily generates ONE BI dashboard tile spec grounded in the introspected schema (same permission as the other Lily routes). The result is validated structurally (bi::validate_tiles) and its query parse-checked — editor-ready, never auto-executed.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_ai_bi_tile_post_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_ai_bi_tile_post_200_response"
          description: generated tile + validity verdict
        "503":
          description: opencode unavailable
  /ai/summarize:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_ai_summarize_post_request"
      responses:
        "200":
          description: natural-language summary with sampling disclosure
  /ai/status:
    get:
      responses:
        "200":
          description: opencode availability + model
      security: []
  /databases:
    get:
      responses:
        "200":
          description: instance list
      summary: list instances + status + endpoint + live health
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_databases_post_request"
        required: true
      responses:
        "202":
          description: accepted; instance provisioning (WardenInstance)
        "400":
          description: WARDEN_INVALID_REQUEST
        "403":
          description: WARDEN_QUOTA_EXCEEDED / disk headroom
        "503":
          description: WARDEN_DOCKER_UNAVAILABLE
      summary: request a database instance (async provisioning job)
  /databases/{fqdn}:
    delete:
      parameters:
      - explode: false
        in: path
        name: fqdn
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: mode
        required: false
        schema:
          enum:
          - archive
          - ""
          type: string
        style: form
      - explode: true
        in: query
        name: force
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          description: archived; artifact path when dumped
        "409":
          description: WARDEN_DESTROY_REFUSED
      summary: destroy an instance (refuses non-empty unless mode=archive or force=true)
    get:
      parameters:
      - explode: false
        in: path
        name: fqdn
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: WardenInstance
        "404":
          description: NOT_FOUND
      summary: "instance detail (engine, size, health, alias)"
  /databases/{fqdn}/restart:
    post:
      parameters:
      - explode: false
        in: path
        name: fqdn
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: WardenInstance post-restart
      summary: stop+start keeping the data volume
  /databases/{fqdn}/health:
    get:
      parameters:
      - explode: false
        in: path
        name: fqdn
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: status + endpoint
      summary: health banner (status from a real adapter ping)
  /warden/audit:
    get:
      responses:
        "200":
          description: audit rows
      summary: lifecycle audit trail (request/active/destroy/restart per principal)
  /auth/register:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_auth_register_post_request"
        required: true
      responses:
        "201":
          description: org + owner user created; returns access/refresh tokens
        "400":
          description: validation error
      security: []
  /auth/login:
    post:
      requestBody:
        content:
          application/json:
            schema:
              required:
              - email
              - password
              type: object
        required: true
      responses:
        "200":
          description: "TokenPair (access_token JWT HS256, refresh_token)"
        "401":
          description: invalid credentials
      security: []
  /auth/refresh:
    post:
      requestBody:
        content:
          application/json:
            schema:
              required:
              - refresh_token
              type: object
        required: true
      responses:
        "200":
          description: rotated TokenPair (old refresh invalidated)
      security: []
  /auth/me:
    get:
      responses:
        "200":
          description: "resolved Principal (org_id, user_id, role, via, permissions[])"
  /auth/permissions:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_auth_permissions_get_200_response"
          description: |
            V6 permission framework — `role`, `permissions` (the caller's
            effective `module:resource:action` set) and `catalog` (every
            guarded permission with its description). Routes are gated by
            `rbac_mw` against this table; unknown routes fail closed.
      summary: caller's effective permissions + the full module:resource:action catalog
  /auth/users:
    get:
      responses:
        "200":
          description: "org members — id, email, role, permissions[] (custom grants),\
            \ created_at"
    post:
      requestBody:
        content:
